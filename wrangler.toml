name = "ucoy-temple-website"
compatibility_date = "2026-10-12"
compatibility_flags = ["global_fetch_strictly_public"]

# If you have a Worker script (server-side code), point to it:
# main = "src/index.ts"

# If this is a static-only site (no server code), use assets only:
[assets]
directory = "⟶ ./dist"          # path to your built static files
binding = "ASSETS"

# Plaintext environment variables
[vars]
MY_VARIABLE = "⟶ my-value"
ANOTHER_VAR = "⟶ another-value"

# Declare which secrets your Worker expects (names only, not values)
[secrets]
required = ["⟶ CONTACT_EMAIL", "⟶ FORM_ENDPOINT", "⟶ CALENDAR_TIMEZONE"]
