<!doctype html>
<!--
  Shown by the service worker when a page is not in the cache and there is no
  connection. It is a plain file rather than a built page on purpose: it has to
  be reachable at a fixed address that the worker can cache by name.

  The colours, and the one square corner value, repeat src/styles/tokens.css,
  because a file served outside the build cannot read the built stylesheet,
  whose name is hashed.
  Keep the two in step until scope feature 16 revisits the offline experience.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-canvas: #fbfaf7;
        --color-surface: #ffffff;
        --color-border: #6f6c62;
        --color-text: #191a20;
        --color-text-muted: #5c5e69;
        --color-accent: #1c4f79;
        --color-accent-hover: #143856;
        --color-on-accent: #ffffff;
        --color-focus: #1c4f79;
        --color-tint: #faf0d0;
        --font-sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-serif: 'Oswald', 'Arial Narrow', sans-serif;
        --text-body: 1.0625rem;
        --text-small: 0.875rem;
        --text-title: clamp(1.5rem, 1.3rem + 1vw, 1.75rem);
        --body-line-height: 1.65;
        --heading-line-height: 1.25;
        --space-2xs: clamp(0.5rem, 1.2vw, 0.75rem);
        --space-m: clamp(1.25rem, 2.8vw, 1.5rem);
        --space-s: clamp(1rem, 2vw, 1.25rem);
        --space-l: clamp(1.5rem, 3.6vw, 2rem);
        --radius: 0;
        --border-width: 1px;
        --focus-width: 3px;
        --focus-offset: 3px;
        --touch-target: 2.75rem;
        --max-content-width: 42rem;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --color-canvas: #14151b;
          --color-surface: #191a20;
          --color-border: #8e8d98;
          --color-text: #f3f2ed;
          --color-text-muted: #a7a7ad;
          --color-accent: #7aabdb;
          --color-accent-hover: #a9cbe9;
          --color-on-accent: #14151b;
          --color-focus: #7aabdb;
          --color-tint: #3a2a06;
        }
      }

      /* An explicit choice carries the same role values as tokens.css,
         so a saved light choice wins over a dark device setting here too. */
      :root[data-theme='light'] {
        --color-canvas: #fbfaf7;
        --color-surface: #ffffff;
        --color-border: #6f6c62;
        --color-text: #191a20;
        --color-text-muted: #5c5e69;
        --color-accent: #1c4f79;
        --color-accent-hover: #143856;
        --color-on-accent: #ffffff;
        --color-focus: #1c4f79;
        --color-tint: #faf0d0;
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --color-canvas: #14151b;
        --color-surface: #191a20;
        --color-border: #8e8d98;
        --color-text: #f3f2ed;
        --color-text-muted: #a7a7ad;
        --color-accent: #7aabdb;
        --color-accent-hover: #a9cbe9;
        --color-on-accent: #14151b;
        --color-focus: #7aabdb;
        --color-tint: #3a2a06;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-m);
        min-height: 100dvh;
        margin: 0;
        padding: var(--space-m);
        background: var(--color-canvas);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: var(--body-line-height);
        text-align: center;
      }

      .panel {
        max-width: var(--max-content-width);
        padding: var(--space-l);
        border: var(--border-width) solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface);
      }

      h1 {
        margin: 0 0 var(--space-2xs);
        color: var(--color-text);
        font-family: var(--font-serif);
        font-size: var(--text-title);
        line-height: var(--heading-line-height);
      }

      p {
        margin: 0 0 var(--space-s);
      }

      p:last-of-type {
        margin-bottom: 0;
      }

      .note {
        color: var(--color-text-muted);
        font-size: var(--text-small);
      }

      a.button {
        display: inline-flex;
        align-items: center;
        min-height: var(--touch-target);
        margin-top: var(--space-2xs);
        padding: var(--space-2xs) var(--space-m);
        border-radius: var(--radius);
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-weight: 600;
        text-decoration: none;
      }

      a.button:focus-visible {
        outline: var(--focus-width) solid var(--color-focus);
        outline-offset: var(--focus-offset);
      }
    </style>
    <script>
      try {
        var saved = localStorage.getItem('ucoy-theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) {
        /* device setting decides */
      }
    </script>
  </head>
  <body>
    <main class="panel">
      <h1>There is no connection</h1>
      <p>
        This page has not been saved on your device yet, so it cannot be opened without a
        connection. Pages you have already opened are still available.
      </p>
      <p class="note">Reconnect, then open the page again.</p>
      <a class="button" href="/">Go to the home page</a>
    </main>
  </body>
</html>
