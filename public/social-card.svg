<!--
  Social card for the United Congregation of Yisra'Yah website.
  Used as the og:image and twitter:image when a page link is shared.
  Dimensions 1200 x 630 (standard for Open Graph and Twitter Cards).
  Colours match the design tokens in src/styles/tokens.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg { fill: #000000; }
      .accent { fill: #015da3; }
      .gold { fill: #ffe010; }
      .title { fill: #ffffff; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 72px; font-weight: 600; }
      .subtitle { fill: #a5a5a5; font-family: 'Roboto', system-ui, sans-serif; font-size: 32px; }
      .hebrew { fill: #ffffff; font-family: 'Roboto', system-ui, sans-serif; font-size: 48px; }
    </style>
  </defs>

  <!-- Background: black, matching the sidebar and dark mode canvas -->
  <rect class="bg" width="1200" height="630" />

  <!-- Accent bar: Kosher Blue, left edge -->
  <rect class="accent" x="0" y="0" width="8" height="630" />

  <!-- Gold accent line: Royal Gold, above title -->
  <rect class="gold" x="100" y="210" width="60" height="4" />

  <!-- Temple name -->
  <text class="title" x="100" y="310">United Congregation of Yisra'Yah</text>

  <!-- Hebrew text -->
  <text class="hebrew" x="100" y="390" direction="rtl">עדת ישראה</text>

  <!-- Subtitle -->
  <text class="subtitle" x="100" y="460">Orthodox Jewish Temple in Jamaica</text>
</svg>
